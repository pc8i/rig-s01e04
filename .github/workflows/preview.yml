name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global --ignore-scripts pnpm@12.16.1
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - name: Save the digest page
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: |
          pnpm start &
          server=$!
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8787/health && break; sleep 1; done
          mkdir -p _site
          curl -sf -o _site/index.html http://localhost:8787/digest/2026-10-28
          kill "$server" || true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
